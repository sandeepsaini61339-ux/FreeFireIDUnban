name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q FreeFireIDUnban_Android_Project.zip -d project
          echo "Extracted files:"
          find project -maxdepth 4 -type f | sort

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find Android project
        run: |
          APP_GRADLE=$(find project -type f -path '*/app/build.gradle' | head -n 1)
          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireIDUnban-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
