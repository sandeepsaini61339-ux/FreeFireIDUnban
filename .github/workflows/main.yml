name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q FreeFireIDUnban_Android_Project.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -50

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: find_project
        run: |
          DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $DIR"

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireIDUnban-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
