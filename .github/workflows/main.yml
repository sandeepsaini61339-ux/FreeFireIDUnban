name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q FreeFireIDUnban_Android_Project.zip -d project

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Fix JVM target
        working-directory: project
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle
          sed -i 's/sourceCompatibility[[:space:]]*=[[:space:]]*1\.8/sourceCompatibility = 17/g' app/build.gradle
          sed -i 's/targetCompatibility[[:space:]]*=[[:space:]]*1\.8/targetCompatibility = 17/g' app/build.gradle
          sed -i 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' app/build.gradle

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeFireIDUnban-APK
          path: project/app/build/outputs/apk/debug/*.apk
